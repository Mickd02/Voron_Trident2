#####################################################################
# Filament Selection
#
# Flow ratio remains in the OrcaSlicer filament profile.
#####################################################################

[gcode_macro SELECT_FILAMENT]
description: Apply material-specific Z adjustment and pressure advance

variable_pla_z_offset: 0.050
variable_pla_pressure_advance: 0.035

variable_petg_z_offset: 0.000
variable_petg_pressure_advance: 0.045

variable_abs_z_offset: 0.000
variable_abs_pressure_advance: 0.040

variable_asa_z_offset: 0.190
variable_asa_pressure_advance: 0.040

gcode:
  {% set S = printer["gcode_macro SELECT_FILAMENT"] %}
  {% set MATERIAL = params.MATERIAL|default("PLA")|string|upper %}

  # Remove any previous temporary material offset.
  SET_GCODE_OFFSET Z=0 MOVE=0

  {% if MATERIAL == "PLA" %}
    SET_GCODE_OFFSET Z_ADJUST={S.pla_z_offset} MOVE=0
    SET_PRESSURE_ADVANCE ADVANCE={S.pla_pressure_advance}
    RESPOND TYPE=echo MSG="FILAMENT: PLA | Z +{S.pla_z_offset} | PA {S.pla_pressure_advance}"

  {% elif MATERIAL == "PETG" %}
    SET_GCODE_OFFSET Z_ADJUST={S.petg_z_offset} MOVE=0
    SET_PRESSURE_ADVANCE ADVANCE={S.petg_pressure_advance}
    RESPOND TYPE=echo MSG="FILAMENT: PETG | Z {S.petg_z_offset} | PA {S.petg_pressure_advance}"

  {% elif MATERIAL == "ABS" %}
    SET_GCODE_OFFSET Z_ADJUST={S.abs_z_offset} MOVE=0
    SET_PRESSURE_ADVANCE ADVANCE={S.abs_pressure_advance}
    RESPOND TYPE=echo MSG="FILAMENT: ABS | Z {S.abs_z_offset} | PA {S.abs_pressure_advance}"

  {% elif MATERIAL == "ASA" %}
    SET_GCODE_OFFSET Z_ADJUST={S.asa_z_offset} MOVE=0
    SET_PRESSURE_ADVANCE ADVANCE={S.asa_pressure_advance}
    RESPOND TYPE=echo MSG="FILAMENT: ASA | Z {S.asa_z_offset} | PA {S.asa_pressure_advance}"

  {% else %}
    SET_PRESSURE_ADVANCE ADVANCE=0
    RESPOND TYPE=error MSG="Unknown filament type: {MATERIAL}"

  {% endif %}